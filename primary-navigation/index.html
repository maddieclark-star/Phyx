<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHYX — Primary Navigation (Transparent)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=DM+Sans:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="demo-backdrop">
    <nav class="nav" aria-label="Primary">
      <div class="nav__container">
        <div class="nav__menu-group">
          <img class="nav__logo" src="assets/phyx-logo.svg" alt="PHYX" />

          <ul class="nav__links">
            <li><a class="nav__link" href="#">How it works</a></li>
            <li><a class="nav__link" href="#">Explore</a></li>
            <li><a class="nav__link" href="#">Labs</a></li>
            <li><a class="nav__link" href="#">Academy</a></li>
            <li><a class="nav__link" href="#">About</a></li>
          </ul>
        </div>

        <div class="nav__utilities">
          <div class="nav__ctas">
            <button class="nav__button nav__button--primary" type="button">Patient login</button>
            <button class="nav__button nav__button--secondary" type="button">Start assessment</button>
          </div>
        </div>
      </div>
    </nav>
  </div>
</body>
</html>
